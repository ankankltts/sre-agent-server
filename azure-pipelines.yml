trigger:
- azure-pipelines #considered as main

pool:
  vmImage: ubuntu-latest

stages:
# --------------------
# 1️⃣ Build Stage
# --------------------
- stage: Build
  jobs:
  - job: Build
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - script: |
        npm install
      displayName: 'npm install'

      # Create a zip from everything in the repo root
    - task: ArchiveFiles@2
      displayName: 'Archive source code'
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/drop/myapp_$(Build.BuildId).zip'
        replaceExistingArchive: true

    # Publish the zip as artifact
    - task: PublishBuildArtifacts@1
      displayName: 'Publish artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/drop'
        ArtifactName: 'drop'
        publishLocation: 'Container'


# 2️⃣ Dev Deployment Stage
# --------------------
- stage: Dev
  dependsOn: Build
  jobs:
  - deployment: DeployToDev
    displayName: 'Deploy to Dev environment'
    environment: 'Dev'   # This links to Azure Pipelines "Environments"
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop   # Download the "drop" artifact from Build stage

          - script: |
              echo "Contents of downloaded artifact:"
              ls -R $(Pipeline.Workspace)/drop

          # Example: Deploy ZIP to Azure Web App
          - task: AzureWebApp@1
            displayName: 'Deploy to Dev WebApp'
            inputs:
              azureSubscription: 'Your-Service-Connection-Name'
              appName: 'your-dev-app-name'
              package: '$(Pipeline.Workspace)/drop/myapp_$(Build.BuildId).zip'









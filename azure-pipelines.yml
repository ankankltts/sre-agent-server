# 1️⃣ Build Stage
# --------------------
- stage: Build
  jobs:
  - job: Build
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - script: |
        npm install
      displayName: 'npm install'

    # (Optional) If you want to run build scripts
    - script: |
        npm run build
      displayName: 'npm build'
      continueOnError: false

    # Archive all files into a zip package
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        replaceExistingArchive: true
      displayName: 'Archive project files'

    # Publish the zip as artifact
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

# 2️⃣ Dev Deployment Stage
# --------------------
- stage: Dev
  dependsOn: Build
  jobs:
  - deployment: DeploytoDev
    environment: 'Dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - task: AzureWebApp@1
            inputs:
              azureSubscription: 'DCFC Integration-Site Reliability Engineering'
              appName: 'sre-server'
              package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'

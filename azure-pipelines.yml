trigger:
- azure-pipelines #considered as main

pool:
  vmImage: ubuntu-latest

stages:
# --------------------
# 1️⃣ Build Stage
# --------------------
- stage: Build
  jobs:
  - job: Build
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - script: |
        npm install
      displayName: 'npm install'

      # Create a zip from everything in the repo root
    - task: ArchiveFiles@2
      displayName: 'Archive source code'
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/drop/myapp_$(Build.BuildId).zip'
        replaceExistingArchive: true

    # Publish the zip as artifact
    - task: PublishBuildArtifacts@1
      displayName: 'Publish artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/drop'
        ArtifactName: 'drop'
        publishLocation: 'Container'


# 2️⃣ Dev Deployment Stage
# --------------------
- stage: Dev
  dependsOn: Build
  variables:
    - group: DevConfig

  jobs:
  - deployment: DeployToDev
    displayName: 'Deploy to Dev environment'
    environment: 'Dev'   # This links to Azure Pipelines "Environments"
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop   # Download the "drop" artifact from Build stage
          
          # ✅ Debugging: print all variables to confirm they are available
          - script: |
              echo "================= VARIABLE DUMP ================="
              echo "Build.BuildId = $(Build.BuildId)"
              echo "Pipeline.Workspace = $(Pipeline.Workspace)"
              echo "Release.EnvironmentName = $(Release.EnvironmentName)"
              echo "From Variable Group (DevConfig): $(PPBASE_URL)"   
              echo "=================================================="
            displayName: "Debug Variables"



          # (Optional) Inspect the downloaded artifact
          - script: |
              echo "Downloaded files:"
              ls -R $(Pipeline.Workspace)/drop
            displayName: "Check downloaded artifact"
           # (Optional) Unzip the file if needed
          - task: ExtractFiles@1
            displayName: 'Extract ZIP'
            inputs:
              archiveFilePatterns: '$(Pipeline.Workspace)/drop/myapp_*.zip'
              destinationFolder: '$(Pipeline.Workspace)/unzipped'
              cleanDestinationFolder: true  

          # Example: Deploy ZIP to Azure Web App
          - task: AzureWebApp@1
            displayName: 'Deploy to Dev WebApp'
            inputs:
              azureSubscription: 'DCFC Integration-Site Reliability Engineering'
              appName: 'sre-server'
              package: '$(Pipeline.Workspace)/drop/myapp_$(Build.BuildId).zip'
              appSettings: |
                - PPBASE_URL=$(PPBASE_URL)
                - API_KEY=$(API_KEY)









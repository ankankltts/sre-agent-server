trigger:
- azure-pipelines #considered as main

pool:
  vmImage: ubuntu-latest

stages:
# --------------------
# 1️⃣ Build Stage
# --------------------
- stage: Build
  jobs:
  - job: Build
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - script: |
        npm install
      displayName: 'npm install'

      # Create a zip from everything in the repo root
    - task: ArchiveFiles@2
      displayName: 'Archive source code'
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/drop/myapp.zip'
        replaceExistingArchive: true

    # Publish the zip as artifact
    - task: PublishBuildArtifacts@1
      displayName: 'Publish artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/drop'
        ArtifactName: 'drop'
        publishLocation: 'Container'












trigger:
- azure-pipelines #considered as main

pool:
  vmImage: ubuntu-latest

stages:
# --------------------
# 1️⃣ Build Stage
# --------------------
- stage: Build
  jobs:
  - job: Build
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - script: |
        npm install
      displayName: 'npm install'

    - task: CopyFiles@2
      displayName: 'Copy scripts'
      inputs:
       sourceFolder: '$(Build.SourcesDirectory)'
       contents: 'scripts/**'
       targetFolder: '$(Build.ArtifactStagingDirectory)/scripts'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish scripts artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/scripts'
        ArtifactName: 'drop'
        publishLocation: 'Container'

# 2️⃣ Dev Deployment Stage
- stage: Dev
  dependsOn: Build
  jobs:
  - deployment: DeploytoDev
    environment: 'Dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - task: AzureWebApp@1
            inputs:
              azureSubscription: 'DCFC Integration-Site Reliability Engineering'
              appName: 'sre-server'
              package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'










trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:
# Stage 1 - Build
- stage: Build
  jobs:
  - job: BuildJob
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - script: npm install
      displayName: 'npm install'

    - task: CopyFiles@2
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)'
        Contents: '**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

# Stage 2 - Deploy to Dev
- stage: Dev
  dependsOn: Build
  jobs:
  - deployment: DeployToDev
    environment: 'Dev' # Will allow approvals/checks
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - task: AzureWebApp@1
            inputs:
              azureSubscription: 'DCFC Integration-Site Reliability Engineering'
              appName: 'sre-server'
              package: '$(Pipeline.Workspace)/drop/**/*.zip'
